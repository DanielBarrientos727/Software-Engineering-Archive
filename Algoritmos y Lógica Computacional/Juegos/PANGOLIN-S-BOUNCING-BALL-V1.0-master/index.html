<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
<title>arkanoid pangolin</title>

 <style>
    body {
background-image: url('./assets/bg.png');
background-size: 100%;
background-size: 100%; 

    }

    canvas {
        border: 6px solid #000000;
        border-bottom : none; 
        background : url('./assets/bkg.png') repeat;
        background-size: 100%;
        background-size: 100% contain;

        margin : 0 auto; 
        display : block;
    
    }
 </style>
 </head>

 <body>
    <canvas></canvas>

    <img hidden id="sprite" src="./assets/sprite.png" alt="sprites pangolin"/>
    <img hidden id="bricks" src="./assets/bricks.png" alt='sprite bricks pangolin' />
    >

 <script>
   const canvas = document.querySelector('canvas')
    const ctx = canvas.getContext('2d') // 2D rendering context
    
    const $sprite = document.querySelector('#sprite')
    const $bricks = document.querySelector('#bricks')

    canvas.width = 448
    canvas.height = 400
    /* variables de nuestro juego */
    let counter = 0

    /* VARIABLES DE LA PELOTA */
    const ballRadius = 12;
    // posiciones de la pelota //
    let x = canvas.width / 2
    let y = canvas.height - 30
    // velocidad de la pelota
    let dx = 3
    let dy = -3

    /* variables de la paleta */
    const paddleHeigth = 10;
    const paddlewidth = 50;

    let paddleX = (canvas.width - paddlewidth) / 2
    let paddleY = canvas.height - paddleHeigth - 10

    let rightPressed = false
    let leftPressed  = false 

    /* variables de los ladrillos */$bricks
    const brickRowcount = 6;
    const brickColumnCount = 13;
    const brickWidth = 32;
    const brickheight = 16;
    const brickPadding = 0;
    const brickOffsetTop = 80;
    const brickOffsetLeft = 16;
    const Bricks = [];

    const BRICK_STATUS = {
        ACTIVE: 1,
        DESTROYED: 0
    }

    for (let c = 0; c < brickColumnCount; c++){
        bricks[c] = [] // incicializamos con un array vacio
        for ( let r = 0; r <brickRowcount; r++) {
            //aqui estamos es calculando lo que viene siendo la posicion del ladrillo en la pantalla :)
          const brickX = c * (brickWidth + brickPadding) +
          brickOffsetLeft

          const brickY = r * (brickheight + brickPadding) +
          brickOffsetTop
          // asignar un color aleatorio a cada ladrillo
          const random = Math.floor(Math.random() * 8)
          // este truco es importante de aprenderselo mano
          // guardar informacion de cada ladrillo
          bricks[c][r] = { 
            x: brickX,
            y: brickY,
            status: BRICK_STATUS.ACTIVE,
            color: random 
        }


        }
    }


    const PADDLE_SENSITIVITY = 8

    function drawBall() {
        ctx.beginPath()
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2)
        ctx.fillStyle = 'red';
        ctx.fill()
        ctx.closePath()   
    }
    
    function drawPaddle() { 
       
    

        ctx.drawImage(
            $sprite,
         29,
         172,
         paddlewidth,
         paddleHeigth,
         paddleX,
         paddleY,
         paddlewidth,
         paddleHeigth,

        )
         



    
    }
    function drawBricks () {
        for (let c = 0; c < brickColumnCount; c++){
         for ( let r = 0; r <brickRowcount; r++) {
            const currentBrick = bricks[c][r]
            if (currentBrick.status === BRICK_STATUS.DESTROYED)
            continue;

          
            const clipX = currentBrick.color * 32
            
            ctx.drawImage(
                $bricks,
                clipX,
                0,
                31,
                14,
                currentBrick.x,
                currentBrick.y,
                brickWidth,
                brickheight
            )
          }
        }
     }
    
    function collisionDetection() {
        for (let c = 0; c < brickColumnCount; c++){
         for ( let r = 0; r <brickRowcount; r++) {
           const currentBrick = bricks[c][r]
            if (currentBrick.status === BRICK_STATUS.DESTROYED)
            continue;

            const isBallSameXAsBrick = 
            x > currentBrick.x &&
            x < currentBrick.x + brickWidth

            const isBallSameYAsBrick = 
            y > currentBrick.y &&
            y < currentBrick.y + brickheight 

            if (isBallSameXAsBrick && isBallSameYAsBrick) {
                dy = -dy
                currentBrick.status = BRICK_STATUS.DESTROYED
            }
  
          }
        }
    }
    function ballMovement() {
        // rebotar las pelotas en los laterales
        if ( 
            x + dx > canvas.width - ballRadius || // la pared derecha
            x + dx < ballRadius
        ) {
            dx = -dx 
        }
        // rebotar en la parte de arriba
        if (y + dy < ballRadius) {
            dy = -dy
        }
         // LA PELOTA TOCA LA PALA
         const isBallSameXAsPaddle =
          x > paddleX  &&
          x < paddleX + paddlewidth

          const isBallTouchingPaddle =
          y + dy > paddleY  

         if (isBallSameXAsPaddle && isBallTouchingPaddle) {
            dy = -dy // cambiamos la direccion de la pelota 

         }
        else if ( //LA PELOTA TOCA EL SUELO
            y + dy > canvas.height - ballRadius
            ) {
            console.log('PERDIO SOCIO')
            alert('PERDIO SOCIO JAJSJSJAJ')
            resetGame();
        }

        x += dx
        y += dy
    }

    function paddleMovement() {
        if (rightPressed && paddleX < canvas.width - paddlewidth) {
            paddleX += PADDLE_SENSITIVITY
            
        } else if (leftPressed && paddleX > 0) {
            paddleX -= PADDLE_SENSITIVITY
        }
    }

    function cleanCanvas () {
        ctx.clearRect(0, 0, canvas.width, canvas.height)
    }
    function initEvents () {
        document.addEventListener('keydown', keyDownHandler)
        document.addEventListener('keyup', keyUpHandler)
        
        function keyDownHandler (event) {
            const { key } = event
            if ( key === 'Right' || key === 'ArrowRight') 
            rightPressed = true 
         else if (key === 'Left' || key === 'ArrowLeft'){
            leftPressed = true
        }
    }
    
    }

 function keyUpHandler (event) {
            const { key } = event
            if ( key === 'Right' || key === 'ArrowRight') 
            rightPressed = false
         else if (key === 'Left' || key === 'ArrowLeft'){
            leftPressed = false 
        }
        }


    function draw () {
        cleanCanvas()
        // hay que dibujar los elementos
        drawBall()
        drawPaddle()
        drawBricks()
        //draw score()
        
        // colisiones y movimientos
        collisionDetection()
        ballMovement()
        
        paddleMovement()
        window.requestAnimationFrame(draw)
    }
    draw();
    initEvents();
    function resetGame(){
        x = canvas.width / 2;
    y = canvas.height -30;

    dx= 2
    dy = -2

    paddleX = (canvas.width  - paddlewidth) / 2;

    console.log ("Reiniciando juego...");


    for (let c = 0; c < brickColumnCount; c++){
        for (let r = 0; r < brickColumnCount; r ++){
            bricks[c][r].status = BRICK_STATUS.ACTIVE; 
        }
    }
    

    }
    
 </script>

 </body>
 </html>
