<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIEDRA · PAPEL · TIJERA</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #111118;
    --border: #2a2a3a;
    --accent: #f0e040;
    --accent2: #e040f0;
    --accent3: #40f0e0;
    --win: #40f040;
    --lose: #f04040;
    --tie: #f0a040;
    --text: #e8e8f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Press Start 2P', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  /* Scanlines overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* CRT glow */
  body::after {
    content: '';
    position: fixed;
    inset: -50%;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 99;
  }

  .title {
    font-size: clamp(10px, 2.5vw, 18px);
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent), 0 0 30px rgba(240,224,64,0.4);
    margin-bottom: 6px;
    animation: flicker 4s infinite;
  }

  .subtitle {
    font-family: 'VT323', monospace;
    font-size: clamp(14px, 3vw, 22px);
    color: var(--accent3);
    letter-spacing: 6px;
    margin-bottom: 30px;
    opacity: 0.8;
  }

  @keyframes flicker {
    0%,95%,100% { opacity: 1; }
    96% { opacity: 0.4; }
    97% { opacity: 1; }
    98% { opacity: 0.6; }
    99% { opacity: 1; }
  }

  .scoreboard {
    display: flex;
    gap: 20px;
    margin-bottom: 24px;
  }

  .score-box {
    background: var(--panel);
    border: 2px solid var(--border);
    padding: 10px 20px;
    text-align: center;
    position: relative;
  }

  .score-box::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px solid rgba(255,255,255,0.05);
  }

  .score-label {
    font-size: 7px;
    color: #666;
    margin-bottom: 6px;
    letter-spacing: 2px;
  }

  .score-num {
    font-size: 28px;
    font-family: 'VT323', monospace;
    line-height: 1;
  }

  .score-box.player .score-num { color: var(--accent3); }
  .score-box.cpu .score-num { color: var(--accent2); }
  .score-box.ties .score-num { color: var(--tie); }

  /* Arena */
  .arena {
    background: var(--panel);
    border: 2px solid var(--border);
    padding: 24px;
    width: 100%;
    max-width: 560px;
    margin-bottom: 20px;
    position: relative;
  }

  .arena-inner {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 16px;
    align-items: center;
  }

  .combatant {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .combatant-label {
    font-size: 8px;
    letter-spacing: 2px;
    opacity: 0.5;
  }

  .combatant.player .combatant-label { color: var(--accent3); }
  .combatant.cpu .combatant-label { color: var(--accent2); }

  .choice-display {
    font-size: 52px;
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.03);
    border: 2px solid var(--border);
    transition: all 0.3s;
    position: relative;
  }

  .choice-display.win-glow {
    border-color: var(--win);
    box-shadow: 0 0 20px rgba(64,240,64,0.5), inset 0 0 20px rgba(64,240,64,0.1);
  }

  .choice-display.lose-glow {
    border-color: var(--lose);
    box-shadow: 0 0 20px rgba(240,64,64,0.3), inset 0 0 20px rgba(240,64,64,0.05);
  }

  .vs-text {
    font-size: 22px;
    color: var(--accent);
    text-shadow: 0 0 10px var(--accent);
    font-family: 'VT323', monospace;
  }

  /* Result */
  .result-banner {
    text-align: center;
    margin-top: 16px;
    min-height: 28px;
    padding: 8px;
    font-family: 'VT323', monospace;
    font-size: 28px;
    letter-spacing: 4px;
    transition: all 0.3s;
  }

  .result-banner.win  { color: var(--win);  text-shadow: 0 0 15px var(--win); }
  .result-banner.lose { color: var(--lose); text-shadow: 0 0 15px var(--lose); }
  .result-banner.tie  { color: var(--tie);  text-shadow: 0 0 15px var(--tie); }

  /* Buttons */
  .choices {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .choice-btn {
    background: var(--panel);
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 14px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
    position: relative;
    min-width: 80px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .choice-btn span.emoji { font-size: 30px; line-height: 1; }

  .choice-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 6px 0 rgba(240,224,64,0.3), 0 0 20px rgba(240,224,64,0.2);
  }

  .choice-btn:active {
    transform: translateY(0px);
    box-shadow: none;
  }

  .choice-btn.selected {
    border-color: var(--accent3);
    color: var(--accent3);
    box-shadow: 0 0 15px rgba(64,240,224,0.4);
  }

  .choice-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  /* History */
  .history-title {
    font-size: 7px;
    color: #444;
    letter-spacing: 3px;
    margin-bottom: 10px;
    text-align: center;
  }

  .history-log {
    max-width: 560px;
    width: 100%;
    max-height: 80px;
    overflow-y: auto;
    display: flex;
    flex-direction: column-reverse;
    gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: #333 transparent;
  }

  .log-entry {
    font-family: 'VT323', monospace;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
    padding: 2px 8px;
    background: rgba(255,255,255,0.02);
    letter-spacing: 1px;
  }

  .log-entry .r-win  { color: var(--win); }
  .log-entry .r-lose { color: var(--lose); }
  .log-entry .r-tie  { color: var(--tie); }

  /* Reset */
  .reset-btn {
    background: transparent;
    border: 1px solid #333;
    color: #444;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    padding: 8px 16px;
    cursor: pointer;
    letter-spacing: 2px;
    margin-top: 12px;
    transition: all 0.2s;
  }

  .reset-btn:hover { border-color: var(--lose); color: var(--lose); }

  /* Shake animation */
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-5deg); }
    40% { transform: translateX(6px) rotate(5deg); }
    60% { transform: translateX(-4px) rotate(-3deg); }
    80% { transform: translateX(4px) rotate(3deg); }
  }

  @keyframes bounce {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.1); }
  }

  .animate-shake { animation: shake 0.5s ease; }
  .animate-bounce { animation: bounce 0.4s ease; }

  /* Stars background */
  .stars {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) infinite;
    opacity: 0;
  }

  @keyframes twinkle {
    0%,100% { opacity: 0; }
    50% { opacity: var(--o); }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="title">⚡ PIEDRA · PAPEL · TIJERA ⚡</div>
<div class="subtitle">INSERT COIN TO PLAY</div>

<div class="scoreboard">
  <div class="score-box player">
    <div class="score-label">JUGADOR</div>
    <div class="score-num" id="scorePlayer">0</div>
  </div>
  <div class="score-box ties">
    <div class="score-label">EMPATES</div>
    <div class="score-num" id="scoreTie">0</div>
  </div>
  <div class="score-box cpu">
    <div class="score-label">CPU</div>
    <div class="score-num" id="scoreCPU">0</div>
  </div>
</div>

<div class="arena">
  <div class="arena-inner">
    <div class="combatant player">
      <div class="combatant-label">↑ TÚ</div>
      <div class="choice-display" id="playerDisplay">❓</div>
    </div>
    <div class="vs-text">VS</div>
    <div class="combatant cpu">
      <div class="combatant-label">CPU ↑</div>
      <div class="choice-display" id="cpuDisplay">❓</div>
    </div>
  </div>
  <div class="result-banner" id="resultBanner">— ELIGE TU ARMA —</div>
</div>

<div class="choices">
  <button class="choice-btn" onclick="play('piedra')">
    <span class="emoji">🪨</span>PIEDRA
  </button>
  <button class="choice-btn" onclick="play('papel')">
    <span class="emoji">📄</span>PAPEL
  </button>
  <button class="choice-btn" onclick="play('tijera')">
    <span class="emoji">✂️</span>TIJERA
  </button>
</div>

<div class="history-title">— HISTORIAL —</div>
<div class="history-log" id="historyLog"></div>

<button class="reset-btn" onclick="resetGame()">↺ REINICIAR</button>

<script>
  // ── Estrellas decorativas ──────────────────────────────────
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      --d: ${2 + Math.random() * 4}s;
      --o: ${0.2 + Math.random() * 0.6};
      animation-delay: ${Math.random() * 4}s;
    `;
    starsContainer.appendChild(s);
  }

  // ── Estado del juego ──────────────────────────────────────
  const EMOJIS = { piedra: '🪨', papel: '📄', tijera: '✂️' };
  const OPCIONES = ['piedra', 'papel', 'tijera'];

  let scores = { player: 0, cpu: 0, tie: 0 };
  let ronda = 1;
  let bloqueado = false;

  // ── Lógica principal (if/else + ternario) ─────────────────
  function determinarGanador(jugador, cpu) {
    if (jugador === cpu) return 'tie';

    // Operador ternario anidado para determinar si gana el jugador
    const playerWins =
      (jugador === 'piedra' && cpu === 'tijera') ? true :
      (jugador === 'papel'  && cpu === 'piedra') ? true :
      (jugador === 'tijera' && cpu === 'papel')  ? true : false;

    return playerWins ? 'win' : 'lose';
  }

  function mensajeResultado(resultado, jugador, cpu) {
    if (resultado === 'tie') {
      return `¡EMPATE! ${EMOJIS[jugador]} vs ${EMOJIS[cpu]}`;
    } else if (resultado === 'win') {
      // if/else para el mensaje de victoria según la combinación
      if (jugador === 'piedra' && cpu === 'tijera') return `🪨 APLASTA ✂️ ¡GANASTE!`;
      else if (jugador === 'papel' && cpu === 'piedra') return `📄 CUBRE 🪨 ¡GANASTE!`;
      else return `✂️ CORTA 📄 ¡GANASTE!`;
    } else {
      return cpu === 'piedra' && jugador === 'tijera' ? `🪨 APLASTA ✂️ PERDISTE` :
             cpu === 'papel'  && jugador === 'piedra' ? `📄 CUBRE 🪨 PERDISTE`   :
             `✂️ CORTA 📄 PERDISTE`;
    }
  }

  function play(eleccionJugador) {
    if (bloqueado) return;
    bloqueado = true;

    const eleccionCPU = OPCIONES[Math.floor(Math.random() * 3)];
    const resultado   = determinarGanador(eleccionJugador, eleccionCPU);

    // Actualizar displays
    const playerDisplay = document.getElementById('playerDisplay');
    const cpuDisplay    = document.getElementById('cpuDisplay');
    const banner        = document.getElementById('resultBanner');

    // Reset clases previas
    playerDisplay.className = 'choice-display';
    cpuDisplay.className    = 'choice-display';
    banner.className        = 'result-banner';

    playerDisplay.textContent = EMOJIS[eleccionJugador];
    cpuDisplay.textContent    = '⏳';

    // CPU "piensa" brevemente con un operador ternario para el delay
    const cpuDelay = resultado === 'win' ? 400 : resultado === 'lose' ? 300 : 350;

    setTimeout(() => {
      cpuDisplay.textContent = EMOJIS[eleccionCPU];

      // Aplicar estilos según resultado (if/else)
      if (resultado === 'win') {
        playerDisplay.classList.add('win-glow', 'animate-bounce');
        cpuDisplay.classList.add('lose-glow', 'animate-shake');
        banner.classList.add('win');
        scores.player++;
      } else if (resultado === 'lose') {
        playerDisplay.classList.add('lose-glow', 'animate-shake');
        cpuDisplay.classList.add('win-glow', 'animate-bounce');
        banner.classList.add('lose');
        scores.cpu++;
      } else {
        banner.classList.add('tie');
        scores.tie++;
      }

      banner.textContent = mensajeResultado(resultado, eleccionJugador, eleccionCPU);

      // Actualizar marcador
      document.getElementById('scorePlayer').textContent = scores.player;
      document.getElementById('scoreCPU').textContent    = scores.cpu;
      document.getElementById('scoreTie').textContent    = scores.tie;

      // Agregar al historial
      agregarHistorial(ronda, eleccionJugador, eleccionCPU, resultado);
      ronda++;

      // Desbloquear tras animación
      setTimeout(() => { bloqueado = false; }, 600);
    }, cpuDelay);
  }

  function agregarHistorial(n, jugador, cpu, resultado) {
    const log = document.getElementById('historyLog');
    const entry = document.createElement('div');
    entry.className = 'log-entry';

    // Ternario para clase y símbolo del resultado
    const resClass  = resultado === 'win' ? 'r-win' : resultado === 'lose' ? 'r-lose' : 'r-tie';
    const resSimbolo = resultado === 'win' ? '▲ WIN' : resultado === 'lose' ? '▼ LOSE' : '= TIE';

    entry.innerHTML = `
      <span>#${String(n).padStart(2,'0')} ${EMOJIS[jugador]} vs ${EMOJIS[cpu]}</span>
      <span class="${resClass}">${resSimbolo}</span>
    `;
    log.prepend(entry);
  }

  function resetGame() {
    scores = { player: 0, cpu: 0, tie: 0 };
    ronda  = 1;
    bloqueado = false;

    document.getElementById('scorePlayer').textContent = '0';
    document.getElementById('scoreCPU').textContent    = '0';
    document.getElementById('scoreTie').textContent    = '0';
    document.getElementById('playerDisplay').textContent = '❓';
    document.getElementById('cpuDisplay').textContent    = '❓';
    document.getElementById('playerDisplay').className   = 'choice-display';
    document.getElementById('cpuDisplay').className      = 'choice-display';
    document.getElementById('resultBanner').className    = 'result-banner';
    document.getElementById('resultBanner').textContent  = '— ELIGE TU ARMA —';
    document.getElementById('historyLog').innerHTML      = '';
  }
</script>
</body>
</html>
